<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 240" width="616" height="240" role="img" aria-label="ajazz-deck"><title>ajazz-deck</title><style>.f{fill:#eceef3}.fd{fill:#eceef3;opacity:.3}.a{fill:currentColor}
.fs,.as,.fds{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fs{stroke:#eceef3}.fds{stroke:#eceef3;opacity:.3}.as{stroke:currentColor}
.pulse,.eq,.bob,.turn,.slide,.fall,.scan,.scrub,.swap,.lit,.ripple,.wig,.grow,.cc{transform-box:fill-box;transform-origin:center}
.spin,.rspin{transform-box:view-box;transform-origin:120px 120px}
.wig,.grow{transform-origin:50% 100%}
.chop{transform-box:view-box;transform-origin:184px 104px}
.spin{animation:spin 12s linear infinite}.rspin{animation:spin 8s linear infinite reverse}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.blink{animation:blink 1.6s steps(1) infinite}
.eq{animation:eq 1.6s ease-in-out infinite}
.bob{animation:bob 2.4s ease-in-out infinite}
.slide{animation:slide 3s ease-in-out infinite}
.draw{stroke-dasharray:100;animation:draw 4s ease-in-out infinite}
.ripple{animation:ripple 3s ease-out infinite}
.lit{animation:lit 3s ease-in-out infinite}
.turn{animation:turn 4s ease-in-out infinite}
.scan{animation:scan 3.2s ease-in-out infinite}
.scrub{animation:scrub 4s linear infinite}
.swap{animation:swap 4s ease-in-out infinite}
.fall{animation:fall 2.4s ease-in infinite}
.wig{animation:wig 1.2s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite}
.chop{animation:chop 2.2s ease-in-out infinite}
.cc{animation:cc 8s infinite backwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.28)}}
@keyframes blink{50%{opacity:.15}}
@keyframes eq{50%{transform:scaleY(.35)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes slide{50%{transform:translateX(var(--d,28px))}}
@keyframes draw{0%,10%{stroke-dashoffset:100}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes lit{0%{opacity:0}10%,30%{opacity:1}45%,100%{opacity:0}}
@keyframes turn{50%{transform:scaleX(.12)}}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%,80%{opacity:1}100%{transform:translateY(104px);opacity:0}}
@keyframes scrub{from{transform:translateX(0)}to{transform:translateX(104px)}}
@keyframes swap{0%,20%{transform:none}45%,70%{transform:translateX(var(--d))}95%,100%{transform:none}}
@keyframes fall{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(90px);opacity:0}}
@keyframes wig{50%{transform:rotate(16deg)}}
@keyframes grow{0%{transform:scaleY(.15)}55%,100%{transform:scaleY(1)}}
@keyframes chop{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-16deg)}80%{transform:rotate(3deg)}}
@keyframes cc{0%{opacity:0}4%,22%{opacity:1}26%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
